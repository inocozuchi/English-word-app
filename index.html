<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- ステータスバー: default（コンテンツを潜り込ませない）。色は theme-color で背景に合わせる -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="語源単語" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="語源で覚える英単語クイズ" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <title>語源で英単語</title>
    <script>
      // 保存済みのテーマを描画前に反映（白→黒のちらつき防止）
      try {
        var t = JSON.parse(localStorage.getItem('ety.settings.v1') || '{}').theme;
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <style>
      html, body { background: #fff; margin: 0; }
      @media (prefers-color-scheme: dark) { html:not([data-theme='light']), html:not([data-theme='light']) body { background: #0b0b0d; } }
      html[data-theme='dark'], html[data-theme='dark'] body { background: #0b0b0d; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
